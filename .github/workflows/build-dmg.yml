name: Build macOS DMG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # Install the package using pyproject.toml in the root directory
        pip install .

    - name: Create Entry Point
      run: |
        # Create main.py dynamically for PyInstaller since the repo uses package structure
        echo "import muscriptor" > main.py
        echo "if __name__ == '__main__':" >> main.py
        echo "    print('Starting MuScriptor...')" >> main.py

    - name: Build App with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed \
          --name "MuScriptor" \
          --collect-all muscriptor \
          main.py

    - name: Create DMG
      run: |
        brew install create-dmg
        create-dmg \
          --volname "MuScriptor Installer" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "MuScriptor.app" 175 120 \
          --hide-extension "MuScriptor.app" \
          --app-drop-link 425 120 \
          "MuScriptor-macOS.dmg" \
          "dist/"

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MuScriptor-DMG
        path: MuScriptor-macOS.dmg
